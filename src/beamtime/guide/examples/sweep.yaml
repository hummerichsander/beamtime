# Example "sweep": one hyperparameter swept over several seeds.
# The finding comes first; the stat and the scatter carry it, the curves show how training went,
# the scorecard gives mean ± std per setting, the table every run. Seeds are merged where one point per setting is wanted.
# Each top-level section has a one- or two-word title, which the page shows in its left column.
schema: 1
title: "{{swept}} sweep"
finding: "TODO: the result in one sentence, e.g. which {{swept}} gives the best {{main}}, and by how much."
metrics:
  "{{main}}": {higher_is_better: {{higher}}}
main_metrics: ["{{main}}"]
body:
  - section:
      id: summary
      title: summary
      children:
        - row:
            - stat:
                id: best
                title: "Best {{main}}"
                field: "metric.{{main}}.{{stat}}"
                aggregate: best
            - stat: {id: runs, title: Runs, aggregate: count}
  - section:
      id: evidence
      title: evidence
      children:
        - grid:
            columns: 2
            children:
              - scatter:
                  id: final-vs-setting
                  title: "{{main}} against {{swept}}"
                  x: "{{swept}}"
                  y: "metric.{{main}}.{{stat}}"
                  x_scale: {{swept_scale}}
                  seeds: "{{seeds}}"
                  caption: "Best {{main}} per {{swept}}, mean over seeds."
              - line:
                  id: curves
                  title: "{{main}} over training"
                  y: "{{main}}"
                  by: ["{{swept}}"]
                  band: std
                  caption: "Mean and standard deviation over seeds per {{swept}}."
  - section:
      id: scores-section
      title: scores
      children:
        - scorecard:
            id: scores
            rows: "{{swept}}"
            columns: ["metric.{{main}}.{{stat}}", "metric.{{loss}}.last"]
            caption: "Mean ± std over seeds per {{swept}}, shaded by direction."
  - section:
      id: loss-section
      title: loss
      children:
        - line:
            id: loss
            y: "{{loss}}"
            color: "{{swept}}"
            caption: "{{loss}} of every run, colored by {{swept}}."
  - section:
      id: runs-section
      title: runs
      children:
        - table:
            id: runs-table
            columns: [run.name, run.status, "{{swept}}", "metric.{{main}}.{{stat}}"]
            sort: ["{{sort}}"]
            sparkline: "{{main}}"
