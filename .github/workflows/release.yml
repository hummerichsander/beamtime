name: Release

# a version tag (v0.1.0) builds, checks and publishes that version to PyPI with trusted publishing
# (configure the PyPI project's trusted publisher: this repository, workflow release.yml,
# environment pypi), then makes a GitHub release with the changelog's section.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: The tag names the version
        run: test "v$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uv run python scripts/release.py --wheel-only dist/*.whl
      - run: uv run python scripts/release.py --smoke-only dist/*.whl
      - run: uv run python scripts/release.py --notes > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Beamtime ${GITHUB_REF_NAME#v}" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
