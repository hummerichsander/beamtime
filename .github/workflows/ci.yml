name: CI

on:
  push:
  pull_request:

env:
  SDK_TESTS: tests/sdk tests/format tests/synth tests/test_boundaries.py tests/test_cli.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -q --deselect tests/test_budgets.py::test_cli_startup_budget

  # the SDK and the readers must work in Python 3.10 training environments.
  sdk-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv run pytest -q $SDK_TESTS

  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -q tests/sdk tests/format tests/synth tests/test_boundaries.py tests/test_cli.py

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run pytest -q tests/test_budgets.py

  lightning:
    strategy:
      fail-fast: false
      matrix:
        lightning: ["2.4.*", "2.6.*"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: >
          uv run --with "lightning==${{ matrix.lightning }}" --with torch
          --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          pytest -q tests/sdk/test_lightning.py
