name: CI

on:
  push:
  pull_request:

env:
  SDK_TESTS: tests/sdk tests/format tests/synth tests/test_boundaries.py tests/test_cli.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --extra serve pytest -q --ignore tests/test_budgets.py

  # the SDK and the readers must work in Python 3.10 training environments.
  sdk-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv run pytest -q $SDK_TESTS

  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -q tests/sdk tests/format tests/synth tests/test_boundaries.py tests/test_cli.py

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --extra serve
      - run: uv run --extra serve pytest -q -n0 tests/test_budgets.py

  lightning:
    strategy:
      fail-fast: false
      matrix:
        lightning: ["2.4.*", "2.6.*"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: >
          uv run --with "lightning==${{ matrix.lightning }}" --with torch
          --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          pytest -q tests/sdk/test_lightning.py

  # tokens.css is what tokens.json generates; app CSS takes its values from tokens; the gallery renders.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/build-tokens --check
      - run: python3 scripts/check-design
      - run: uv run --extra serve playwright install --with-deps chromium
      - run: uv run --extra serve pytest -q tests/test_design.py
        env:
          DESIGN_SHOTS: design-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-gallery
          path: design-shots

  # the committed bundle must equal a fresh build; the shell is tested in a real browser.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run docs
        working-directory: web
      - run: test -z "$(git status --porcelain -- src/beamtime/serve/static)"
      - run: uv run --extra serve playwright install --with-deps chromium
      - run: uv run --extra serve pytest -q tests/serve/test_browser.py
