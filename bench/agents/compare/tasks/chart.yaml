prompt: >
  Make a figure of the final val/acc against the learning rate for scaling/lr-sweep, with one point
  per run that finished (final means the last logged value of a run) and a logarithmic x axis. Label
  the axes. Save it as a PNG file in the current directory and give its path.
answer: '{"file": <path of the PNG>}'
time_limit_s: 600
checks:
  file: {kind: file, format: png}
judge:
  - A scatter plot with the final validation accuracy (val/acc) on the y axis and the learning rate on the x axis.
  - The x axis is logarithmic.
  - No points are drawn for runs that failed or were killed (no accuracies near zero, no diverged runs).
  - The highest accuracies are at a learning rate of about 3e-4, and this peak can be read off the plot.
  - Both axes are labelled.
