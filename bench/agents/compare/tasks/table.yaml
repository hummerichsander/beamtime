prompt: >
  The learning-rate sweep ran in two batches, scaling/lr-sweep and later scaling/lr-sweep-2. Make a
  table of every run of both batches (all of them, whatever their status) as a comma-separated text
  file in the current directory, with a header row and the columns run_id, lr, seed, finished,
  superseded, val_acc. Give finished as yes for a run that ran to its end and no for any other;
  superseded as yes when a later run with the same learning rate and seed exists and no otherwise;
  and val_acc as the last logged validation accuracy of the run (empty if it never logged one).
  Write lr and val_acc at full precision, exactly as logged, not rounded. Give the path of the
  file.
answer: '{"file": <path of the table file>}'
time_limit_s: 400
checks:
  file: {kind: file, format: table}
  rows: {kind: table_ids, key: file, truth: rows}
  values: {kind: table_values, key: file, truth: rows, rel: 1.0e-6, abs: 1.0e-6}
  finished: {kind: table_flag, key: file, truth: rows, column: finished}
  superseded: {kind: table_flag, key: file, truth: rows, column: superseded}
