category: external
smoke: true
page: scaling/lr-sweep
files:
  external/jax-sweep.csv: jax-sweep.csv
robust: false
prompt: >
  My colleague ran the lr sweep in JAX; her results are in external/jax-sweep.csv. Put them on the
  scaling/lr-sweep page as a table next to our runs, and save the page.
facts:
  metrics: [val/acc]
  file: {columns: [lr, val_acc], rows: 15}
  finding: >-
    Our runs and her JAX runs are shown together. By best run, lr 3e-4 gives the best val/acc in both
    (about 0.93). By the mean over seeds, hers is also best at 3e-4, while ours is a hair higher at 1e-3
    (about 0.92) because a killed 3e-4 run (0.858) pulls that mean down. A finding that names the best
    lr correctly for either statistic is true; naming 1e-3 as best in ours by the mean is not wrong.
    Per learning rate, the final val/acc as best run / mean over seeds. Ours (17 runs; three seeds
    each at 3e-5, 1e-4, 1e-3 and 3e-3, four at 3e-4 with the killed one, a single failed run at
    0.01): 3e-5 0.871 / 0.864; 1e-4 0.918 / 0.914; 3e-4 0.931 / 0.910 (0.928 over the three finished
    runs); 1e-3 0.920 / 0.920; 3e-3 0.894 / 0.889; 0.01 0.796 / 0.796. Hers (JAX, three seeds each,
    no 3e-5): 1e-4 0.908 / 0.902; 3e-4 0.938 / 0.932; 1e-3 0.921 / 0.917; 3e-3 0.902 / 0.893; 0.01
    0.818 / 0.800.
  overclaims: ["lr 0.01 is best", "the differences are statistically significant"]
checklist:
  - There is a table with her JAX results, with the columns lr, seed and val_acc.
  - The table is her whole sweep, not a selection or a filtered part, with rows for all five learning rates from 1e-4 up to 0.01 and several seeds each. A table cut off at the bottom edge of the block is not a fault of the page's author; the row count itself is scored from the saved view's file query.
  - Our own runs of scaling/lr-sweep are on the page too (a table or a chart), next to hers.
  - The page says that the table is her JAX sweep, not ours (a title, caption or finding).
  - The page has no error messages or empty charts.
