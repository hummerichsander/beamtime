.ic-dom{stroke:#16936a}.bdg-dom{fill:#16936a;fill-opacity:.11}
.ic-idx{stroke:#b07a00}.bdg-idx{fill:#b07a00;fill-opacity:.11}
.ic-store{stroke:#8a6a45}.bdg-store{fill:#8a6a45;fill-opacity:.11}
.ic-remote{stroke:#c2457a}.bdg-remote{fill:#c2457a;fill-opacity:.11}
.ic-actor{stroke:#1c1d20}.bdg-actor{fill:#1c1d20;fill-opacity:.11}
.ic-accent{stroke:#2f5aa8}.bdg-accent{fill:#2f5aa8;fill-opacity:.11}
.usual{fill:#f2f0eb}.ours{fill:#2f5aa8;fill-opacity:.06;stroke:#2f5aa8;stroke-opacity:.35}.colh-acc{fill:#2f5aa8}.inp{fill:#ffffff;stroke:#e3e0d8}.ic-subtle{stroke:#8f8c84}@media (prefers-color-scheme: dark){
.bg{fill:#1e1e1c}
text{fill:#eceae4}
.subtitle,.mu,.mu .it,.mu .bd{fill:#a19d94}
.subtitle .bd{fill:#eceae4}
.colh{fill:#76736c}
.card{fill:#2c2c29;stroke:#393834}
.sub{fill:#1e1e1c;stroke:#393834}
.band{fill:#252523}
.chip-run{fill:#252523;stroke:#393834}
.chip-auth{fill:#2c2c29;stroke:#86a8e8}
.e-call{stroke:#a19d94}.mk-call{fill:#a19d94}.l-call,.l-call .it{fill:#a19d94}
.e-write{stroke:#eb8a5a}.mk-write{fill:#eb8a5a}.l-write,.l-write .it{fill:#eb8a5a}
.e-read{stroke:#86a8e8}.mk-read{fill:#86a8e8}.l-read,.l-read .it{fill:#86a8e8}
.e-event{stroke:#7fb77a}.mk-event{fill:#7fb77a}.l-event,.l-event .it{fill:#7fb77a}
.e-ssh{stroke:#d38bb5}.mk-ssh{fill:#d38bb5}.l-ssh,.l-ssh .it{fill:#d38bb5}
.ic-front{stroke:#6ea6ec}.bdg-front{fill:#6ea6ec;fill-opacity:.11}
.ic-svc{stroke:#9085e9}.bdg-svc{fill:#9085e9;fill-opacity:.11}
.ic-dom{stroke:#4fc39a}.bdg-dom{fill:#4fc39a;fill-opacity:.11}
.ic-idx{stroke:#d9a548}.bdg-idx{fill:#d9a548;fill-opacity:.11}
.ic-store{stroke:#c09a70}.bdg-store{fill:#c09a70;fill-opacity:.11}
.ic-remote{stroke:#e283ab}.bdg-remote{fill:#e283ab;fill-opacity:.11}
.ic-actor{stroke:#eceae4}.bdg-actor{fill:#eceae4;fill-opacity:.11}
.ic-accent{stroke:#86a8e8}.bdg-accent{fill:#86a8e8;fill-opacity:.11}
.usual{fill:#252523}.ours{fill:#86a8e8;fill-opacity:.06;stroke:#86a8e8;stroke-opacity:.35}.colh-acc{fill:#86a8e8}.inp{fill:#2c2c29;stroke:#393834}.ic-subtle{stroke:#76736c}}</style><defs><marker id="p-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-call"/></marker><marker id="p-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-write"/></marker><marker id="p-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-read"/></marker><marker id="p-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-event"/></marker><marker id="p-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-ssh"/></marker></defs><rect class="bg" x="0" y="0" width="1600" height="900"/><text x="64.0" y="74.0" class="title" text-anchor="start">What <tspan class="it">Beamtime</tspan> adds</text><text x="64.0" y="110.0" class="subtitle" text-anchor="start">Experiment tracking for <tspan class="bd">simulations</tspan>, <tspan class="bd">training runs</tspan> and any <tspan class="bd">numerical experiment</tspan>, made for people and agents working together.</text><text x="66.0" y="152.0" class="colh" text-anchor="start">FEATURE</text><text x="488.0" y="152.0" class="colh" text-anchor="start">USUALLY</text><text x="978.0" y="152.0" class="colh colh-acc" text-anchor="start">WITH BEAMTIME</text><rect x="64" y="166" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="210" r="21" class="bdg bdg-dom"/><g transform="translate(93.5 199.5) scale(0.8750)" class="ic ic-dom"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="140.0" y="205.0" class="ft" text-anchor="start">Testable hypotheses</text><text x="140.0" y="229.0" class="tx mu sm" text-anchor="start"><tspan class="it">say what you expect, then check it</tspan></text><rect x="486" y="175" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 186.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="200.0" class="tx mu colt" text-anchor="start">Hypotheses live in your head, a doc, or buried</text><text x="528.0" y="223.0" class="tx mu colt" text-anchor="start">in your coding agent's chat history.</text><rect x="976" y="175" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 186.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="200.0" class="tx colt" text-anchor="start"><tspan class="bd">Proposals</tspan>, the <tspan class="bd">experiments</tspan> that test them, <tspan class="bd">notes</tspan> and</text><text x="1018.0" y="223.0" class="tx colt" text-anchor="start"><tspan class="bd">verdicts</tspan> in one place; predictions are checked for you.</text><rect x="64" y="260" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="304" r="21" class="bdg bdg-svc"/><g transform="translate(93.5 293.5) scale(0.8750)" class="ic ic-svc"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></g><text x="140.0" y="299.0" class="ft" text-anchor="start">People and agents, together</text><text x="140.0" y="323.0" class="tx mu sm" text-anchor="start"><tspan class="it">one shared record of every experiment</tspan></text><rect x="486" y="269" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 280.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="294.0" class="tx mu colt" text-anchor="start">Runs sit on a hosted server; agents reach</text><text x="528.0" y="317.0" class="tx mu colt" text-anchor="start">them through a remote API.</text><rect x="976" y="269" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 280.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="294.0" class="tx colt" text-anchor="start">Agents work on the run files themselves, local or remote,</text><text x="1018.0" y="317.0" class="tx colt" text-anchor="start">with <tspan class="bd">fast, compact MCP</tspan> answers. Everything in <tspan class="bd">one place</tspan>.</text><rect x="64" y="354" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="398" r="21" class="bdg bdg-front"/><g transform="translate(93.5 387.5) scale(0.8750)" class="ic ic-front"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></g><text x="140.0" y="393.0" class="ft" text-anchor="start">Notes and memory, written together</text><text x="140.0" y="417.0" class="tx mu sm" text-anchor="start"><tspan class="it">by people and agents, shown in the UI</tspan></text><rect x="486" y="363" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 374.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="388.0" class="tx mu colt" text-anchor="start">Notes and reports drift apart from the runs</text><text x="528.0" y="411.0" class="tx mu colt" text-anchor="start">and from what was predicted.</text><rect x="976" y="363" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 374.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="388.0" class="tx colt" text-anchor="start">Notes record <tspan class="bd">verdicts</tspan> next to the data; a shared <tspan class="bd">memory</tspan></text><text x="1018.0" y="411.0" class="tx colt" text-anchor="start">keeps the big picture. All of it visible in the UI.</text><rect x="64" y="448" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="492" r="21" class="bdg bdg-idx"/><g transform="translate(93.5 481.5) scale(0.8750)" class="ic ic-idx"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></g><text x="140.0" y="487.0" class="ft" text-anchor="start">Views you fully control</text><text x="140.0" y="511.0" class="tx mu sm" text-anchor="start"><tspan class="it">reusable blocks; coding is not the bottleneck</tspan></text><rect x="486" y="457" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 468.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="482.0" class="tx mu colt" text-anchor="start">Dashboards clicked together for each project,</text><text x="528.0" y="505.0" class="tx mu colt" text-anchor="start">hard to reuse or hand to an agent.</text><rect x="976" y="457" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 468.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="482.0" class="tx colt" text-anchor="start">Agents build <tspan class="bd">any view</tspan> you ask for from <tspan class="bd">reusable blocks</tspan>;</text><text x="1018.0" y="505.0" class="tx colt" text-anchor="start">a good view, once made, serves every new experiment.</text><rect x="64" y="542" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="586" r="21" class="bdg bdg-store"/><g transform="translate(93.5 575.5) scale(0.8750)" class="ic ic-store"><path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M3 5a2 2 0 0 0 2 2h3"/><path d="M3 3v13a2 2 0 0 0 2 2h3"/></g><text x="140.0" y="581.0" class="ft" text-anchor="start">Plain files you own</text><text x="140.0" y="605.0" class="tx mu sm" text-anchor="start"><tspan class="it">no server, no database, no account</tspan></text><rect x="486" y="551" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 562.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="576.0" class="tx mu colt" text-anchor="start">Data locked in a hosted service, a database</text><text x="528.0" y="599.0" class="tx mu colt" text-anchor="start">or binary event files.</text><rect x="976" y="551" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 562.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="576.0" class="tx colt" text-anchor="start">Every run is a plain folder you can read, search and</text><text x="1018.0" y="599.0" class="tx colt" text-anchor="start">version. <tspan class="bd">Nothing to host</tspan>, nothing to migrate.</text><rect x="64" y="636" width="1472" height="88" rx="12" class="card"/><circle cx="104" cy="680" r="21" class="bdg bdg-remote"/><g transform="translate(93.5 669.5) scale(0.8750)" class="ic ic-remote"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="140.0" y="675.0" class="ft" text-anchor="start">Built for clusters</text><text x="140.0" y="699.0" class="tx mu sm" text-anchor="start"><tspan class="it">simulations and training jobs alike</tspan></text><rect x="486" y="645" width="474" height="70" rx="9" class="usual"/><g transform="translate(499.5 656.5) scale(0.7083)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="528.0" y="670.0" class="tx mu colt" text-anchor="start">Jobs need network to upload, or offline runs</text><text x="528.0" y="693.0" class="tx mu colt" text-anchor="start">are synced by hand later.</text><rect x="976" y="645" width="550" height="70" rx="9" class="ours"/><g transform="translate(989.0 656.0) scale(0.7500)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1018.0" y="670.0" class="tx colt" text-anchor="start">See your cluster runs from your laptop over <tspan class="bd">ssh</tspan>: only the</text><text x="1018.0" y="693.0" class="tx colt" text-anchor="start">answers travel, and compute nodes need <tspan class="bd">no internet</tspan>.</text><rect x="64" y="744" width="1472" height="126" rx="12" class="band"/><text x="88.0" y="794.0" class="pl" text-anchor="start"><tspan class="bd">The research cycle</tspan></text><text x="88.0" y="816.0" class="tx mu sm" text-anchor="start"><tspan class="it">what Beamtime keeps,</tspan></text><text x="88.0" y="834.0" class="tx mu sm" text-anchor="start"><tspan class="it">experiment after experiment</tspan></text><rect x="428" y="761" width="64" height="22" rx="11" class="inp"/><text x="460.0" y="776.5" class="tx inpt" text-anchor="middle"><tspan class="it">Theory</tspan></text><polyline points="492,772 510,772" class="e e-call thin"/><rect x="400" y="789" width="92" height="22" rx="11" class="inp"/><text x="446.0" y="804.5" class="tx inpt" text-anchor="middle"><tspan class="it">Literature</tspan></text><polyline points="492,800 510,800" class="e e-call thin"/><rect x="337" y="817" width="155" height="22" rx="11" class="inp"/><text x="414.5" y="832.5" class="tx inpt" text-anchor="middle"><tspan class="it">Ideas and questions</tspan></text><polyline points="492,828 510,828" class="e e-call thin"/><polyline points="510,772 510,828" class="e e-call thin"/><polyline points="510,800 527,800" class="e e-call" marker-end="url(#p-call)"/><circle cx="548" cy="800" r="19" class="bdg bdg-accent"/><g transform="translate(538.5 790.5) scale(0.7917)" class="ic ic-accent"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g><text x="576.0" y="806.0" class="st" text-anchor="start">Proposal</text><polyline points="664,800 710,800" class="e e-call" marker-end="url(#p-call)"/><circle cx="742.0" cy="800" r="19" class="bdg bdg-accent"/><g transform="translate(732.5 790.5) scale(0.7917)" class="ic ic-accent"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="770.0" y="806.0" class="st" text-anchor="start">Experiments</text><polyline points="885,800 931,800" class="e e-call" marker-end="url(#p-call)"/><circle cx="963.0" cy="800" r="19" class="bdg bdg-accent"/><g transform="translate(953.5 790.5) scale(0.7917)" class="ic ic-accent"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g><text x="991.0" y="806.0" class="st" text-anchor="start">Check</text><polyline points="1052,800 1098,800" class="e e-call" marker-end="url(#p-call)"/><circle cx="1130.0" cy="800" r="19" class="bdg bdg-accent"/><g transform="translate(1120.5 790.5) scale(0.7917)" class="ic ic-accent"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g><text x="1158.0" y="806.0" class="st" text-anchor="start">Verdict</text><polyline points="1237,800 1283,800" class="e e-call" marker-end="url(#p-call)"/><circle cx="1315.0" cy="800" r="19" class="bdg bdg-accent"/><g transform="translate(1305.5 790.5) scale(0.7917)" class="ic ic-accent"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 1