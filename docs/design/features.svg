.e-write{stroke:#c4501d}.mk-write{fill:#c4501d}.l-write,.l-write .it{fill:#c4501d}
.e-read{stroke:#2f5aa8}.mk-read{fill:#2f5aa8}.l-read,.l-read .it{fill:#2f5aa8}
.e-event{stroke:#3f7d3a}.mk-event{fill:#3f7d3a}.l-event,.l-event .it{fill:#3f7d3a}
