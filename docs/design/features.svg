<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="What Beamtime adds to experiment tracking for simulations, training runs and other numerical experiments: testable hypotheses, people and agents working on one shared record, notes and memory written together, views built from reusable blocks, plain files you own, and cluster runs seen over ssh; with the research cycle: theory, literature, ideas and questions feed a proposal, then experiments, check, verdict and memory." class="feat"><title>What Beamtime adds</title><style>
