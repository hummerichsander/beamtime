.ours{stroke-width:1}
.cyc{stroke-width:1.5}

.bg{fill:#faf9f6}
text{fill:#1c1d20}
.subtitle,.mu,.mu .it,.mu .bd{fill:#64625c}
.subtitle .bd{fill:#1c1d20}
