<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="What Beamtime adds, compared with W&amp;B, TensorBoard and MLflow: testable hypotheses per run and group, agent-first CLI and MCP, collaborative notes and memory, fully customizable views from reusable blocks, plain files you own, and cluster support over ssh; with the research cycle from proposal to runs, check, verdict and memory." class="feat"><title>What Beamtime adds</title><style>
