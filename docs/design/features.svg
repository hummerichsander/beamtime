.e-event{stroke:#3f7d3a}.mk-event{fill:#3f7d3a}.l-event,.l-event .it{fill:#3f7d3a}
.e-ssh{stroke:#9a3f72}.mk-ssh{fill:#9a3f72}.l-ssh,.l-ssh .it{fill:#9a3f72}
.ic-front{stroke:#2a78d6}.bdg-front{fill:#2a78d6;fill-opacity:.11}
.ic-svc{stroke:#6250d6}.bdg-svc{fill:#6250d6;fill-opacity:.11}
.ic-dom{stroke:#16936a}.bdg-dom{fill:#16936a;fill-opacity:.11}
.ic-idx{stroke:#b07a00}.bdg-idx{fill:#b07a00;fill-opacity:.11}
.ic-store{stroke:#8a6a45}.bdg-store{fill:#8a6a45;fill-opacity:.11}
.ic-remote{stroke:#c2457a}.bdg-remote{fill:#c2457a;fill-opacity:.11}
.ic-actor{stroke:#1c1d20}.bdg-actor{fill:#1c1d20;fill-opacity:.11}
.ic-accent{stroke:#2f5aa8}.bdg-accent{fill:#2f5aa8;fill-opacity:.11}
.usual{fill:#f2f0eb}.ours{fill:#2f5aa8;fill-opacity:.06;stroke:#2f5aa8;stroke-opacity:.35}.colh-acc{fill:#2f5aa8}.ic-subtle{stroke:#8f8c84}@media (prefers-color-scheme: dark){
.bg{fill:#1e1e1c}
text{fill:#eceae4}
.subtitle,.mu,.mu .it,.mu .bd{fill:#a19d94}
.subtitle .bd{fill:#eceae4}
.colh{fill:#76736c}
.card{fill:#2c2c29;stroke:#393834}
.sub{fill:#1e1e1c;stroke:#393834}
.band{fill:#252523}
.chip-run{fill:#252523;stroke:#393834}
.chip-auth{fill:#2c2c29;stroke:#86a8e8}
.e-call{stroke:#a19d94}.mk-call{fill:#a19d94}.l-call,.l-call .it{fill:#a19d94}
.e-write{stroke:#eb8a5a}.mk-write{fill:#eb8a5a}.l-write,.l-write .it{fill:#eb8a5a}
.e-read{stroke:#86a8e8}.mk-read{fill:#86a8e8}.l-read,.l-read .it{fill:#86a8e8}
.e-event{stroke:#7fb77a}.mk-event{fill:#7fb77a}.l-event,.l-event .it{fill:#7fb77a}
.e-ssh{stroke:#d38bb5}.mk-ssh{fill:#d38bb5}.l-ssh,.l-ssh .it{fill:#d38bb5}
.ic-front{stroke:#6ea6ec}.bdg-front{fill:#6ea6ec;fill-opacity:.11}
.ic-svc{stroke:#9085e9}.bdg-svc{fill:#9085e9;fill-opacity:.11}
.ic-dom{stroke:#4fc39a}.bdg-dom{fill:#4fc39a;fill-opacity:.11}
.ic-idx{stroke:#d9a548}.bdg-idx{fill:#d9a548;fill-opacity:.11}
.ic-store{stroke:#c09a70}.bdg-store{fill:#c09a70;fill-opacity:.11}
.ic-remote{stroke:#e283ab}.bdg-remote{fill:#e283ab;fill-opacity:.11}
.ic-actor{stroke:#eceae4}.bdg-actor{fill:#eceae4;fill-opacity:.11}
.ic-accent{stroke:#86a8e8}.bdg-accent{fill:#86a8e8;fill-opacity:.11}
.usual{fill:#252523}.ours{fill:#86a8e8;fill-opacity:.06;stroke:#86a8e8;stroke-opacity:.35}.colh-acc{fill:#86a8e8}.ic-subtle{stroke:#76736c}}</style><defs><marker id="p-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-call"/></marker><marker id="p-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-write"/></marker><marker id="p-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-read"/></marker><marker id="p-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-event"/></marker><marker id="p-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-ssh"/></marker></defs><rect class="bg" x="0" y="0" width="1600" height="900"/><text x="64.0" y="74.0" class="title" text-anchor="start">What <tspan class="it">Beamtime</tspan> adds</text><text x="64.0" y="110.0" class="subtitle" text-anchor="start">Experiment logging built around <tspan class="bd">hypotheses</tspan>, <tspan class="bd">agents</tspan> and <tspan class="bd">clusters</tspan>.</text><text x="66.0" y="152.0" class="colh" text-anchor="start">FEATURE</text><text x="558.0" y="152.0" class="colh" text-anchor="start">USUALLY · W&amp;B, TENSORBOARD, MLFLOW</text><text x="1030.0" y="152.0" class="colh colh-acc" text-anchor="start">WITH BEAMTIME</text><rect x="64" y="166" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="213" r="21" class="bdg bdg-dom"/><g transform="translate(93.5 202.5) scale(0.8750)" class="ic ic-dom"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="140.0" y="208.0" class="ft" text-anchor="start">Testable hypotheses</text><text x="140.0" y="232.0" class="tx mu sm" text-anchor="start"><tspan class="it">per run and per group</tspan></text><rect x="556" y="176" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 191.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="204.0" class="tx mu sm" text-anchor="start">Hypotheses live in your head or a doc;</text><text x="598.0" y="226.0" class="tx mu sm" text-anchor="start">runs carry tags, not predictions.</text><rect x="1028" y="176" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 190.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="204.0" class="tx sm" text-anchor="start"><tspan class="bd">Proposals</tspan> with named <tspan class="bd">predictions</tspan>, frozen once a run</text><text x="1070.0" y="226.0" class="tx sm" text-anchor="start">records them; checked with t-intervals: <tspan class="cd">pass</tspan> · <tspan class="cd">fail</tspan>.</text><rect x="64" y="268" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="315" r="21" class="bdg bdg-svc"/><g transform="translate(93.5 304.5) scale(0.8750)" class="ic ic-svc"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="140.0" y="310.0" class="ft" text-anchor="start">Agent-first by design</text><text x="140.0" y="334.0" class="tx mu sm" text-anchor="start"><tspan class="it">CLI and MCP over one operation set</tspan></text><rect x="556" y="278" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 293.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="306.0" class="tx mu sm" text-anchor="start">Built for people and scripts; agent access</text><text x="598.0" y="328.0" class="tx mu sm" text-anchor="start">comes later, as a separate layer.</text><rect x="1028" y="278" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 292.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="306.0" class="tx sm" text-anchor="start"><tspan class="cd">note add</tspan> ↔ <tspan class="cd">note_add</tspan>: the same operations, small</text><text x="1070.0" y="328.0" class="tx sm" text-anchor="start">answers, ~100 ms a call; agent writes are <tspan class="bd">additive</tspan>.</text><rect x="64" y="370" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="417" r="21" class="bdg bdg-front"/><g transform="translate(93.5 406.5) scale(0.8750)" class="ic ic-front"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></g><text x="140.0" y="412.0" class="ft" text-anchor="start">Collaborative notes and memory</text><text x="140.0" y="436.0" class="tx mu sm" text-anchor="start"><tspan class="it">by people and agents, shown in the UI</tspan></text><rect x="556" y="380" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 395.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="408.0" class="tx mu sm" text-anchor="start">Free-text notes and reports next to the runs,</text><text x="598.0" y="430.0" class="tx mu sm" text-anchor="start">detached from what was predicted.</text><rect x="1028" y="380" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 394.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="408.0" class="tx sm" text-anchor="start">Typed notes carry <tspan class="bd">verdicts</tspan> on predictions; <tspan class="bd">memory</tspan></text><text x="1070.0" y="430.0" class="tx sm" text-anchor="start">compresses them. Every version kept, edited in the UI.</text><rect x="64" y="472" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="519" r="21" class="bdg bdg-idx"/><g transform="translate(93.5 508.5) scale(0.8750)" class="ic ic-idx"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></g><text x="140.0" y="514.0" class="ft" text-anchor="start">Views you fully control</text><text x="140.0" y="538.0" class="tx mu sm" text-anchor="start"><tspan class="it">reusable blocks; coding is not the bottleneck</tspan></text><rect x="556" y="482" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 497.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="510.0" class="tx mu sm" text-anchor="start">Dashboards clicked together per project,</text><text x="598.0" y="532.0" class="tx mu sm" text-anchor="start">hard to diff, reuse or hand to an agent.</text><rect x="1028" y="482" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 496.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="510.0" class="tx sm" text-anchor="start">Agents write views as <tspan class="bd">YAML</tspan> from widgets and <tspan class="bd">custom</tspan></text><text x="1070.0" y="532.0" class="tx sm" text-anchor="start"><tspan class="bd">blocks</tspan>; library blocks are pinned, validated, reused.</text><rect x="64" y="574" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="621" r="21" class="bdg bdg-store"/><g transform="translate(93.5 610.5) scale(0.8750)" class="ic ic-store"><path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M3 5a2 2 0 0 0 2 2h3"/><path d="M3 3v13a2 2 0 0 0 2 2h3"/></g><text x="140.0" y="616.0" class="ft" text-anchor="start">Plain files you own</text><text x="140.0" y="640.0" class="tx mu sm" text-anchor="start"><tspan class="it">no server, no database, no account</tspan></text><rect x="556" y="584" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 599.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="612.0" class="tx mu sm" text-anchor="start">Data sits on a server or in a database;</text><text x="598.0" y="634.0" class="tx mu sm" text-anchor="start">TensorBoard writes binary event files.</text><rect x="1028" y="584" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 598.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="612.0" class="tx sm" text-anchor="start">A run is a folder of JSON and logs: <tspan class="cd">cat</tspan>, <tspan class="cd">grep</tspan>, <tspan class="cd">git diff</tspan>.</text><text x="1070.0" y="634.0" class="tx sm" text-anchor="start">The index is only a cache, rebuilt from the files.</text><rect x="64" y="676" width="1472" height="94" rx="12" class="card"/><circle cx="104" cy="723" r="21" class="bdg bdg-remote"/><g transform="translate(93.5 712.5) scale(0.8750)" class="ic ic-remote"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="140.0" y="718.0" class="ft" text-anchor="start">Built for clusters</text><text x="140.0" y="742.0" class="tx mu sm" text-anchor="start"><tspan class="it">query over ssh, nothing synced</tspan></text><rect x="556" y="686" width="456" height="74" rx="9" class="usual"/><g transform="translate(570.0 701.0) scale(0.6667)" class="ic ic-subtle"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></g><text x="598.0" y="714.0" class="tx mu sm" text-anchor="start">Jobs need network to upload, or sync offline</text><text x="598.0" y="736.0" class="tx mu sm" text-anchor="start">runs later; or forward a port per machine.</text><rect x="1028" y="686" width="498" height="74" rx="9" class="ours"/><g transform="translate(1041.5 700.5) scale(0.7083)" class="ic ic-accent"><path d="M20 6 9 17l-5-5"/></g><text x="1070.0" y="714.0" class="tx sm" text-anchor="start">The laptop queries <tspan class="cd">@cluster/…</tspan> over ssh and only the</text><text x="1070.0" y="736.0" class="tx sm" text-anchor="start">answers travel. Compute nodes need no internet.</text><rect x="64" y="790" width="1472" height="80" rx="12" class="band"/><text x="88.0" y="823.0" class="pl" text-anchor="start"><tspan class="bd">The research cycle</tspan></text><text x="88.0" y="845.0" class="tx mu sm" text-anchor="start"><tspan class="it">what the record keeps, run after run</tspan></text><circle cx="420" cy="820" r="19" class="bdg bdg-accent"/><g transform="translate(410.5 810.5) scale(0.7917)" class="ic ic-accent"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g><text x="448.0" y="826.0" class="st" text-anchor="start">Proposal</text><polyline points="536,820 604,820" class="e e-call" marker-end="url(#p-call)"/><circle cx="634" cy="820" r="19" class="bdg bdg-accent"/><g transform="translate(624.5 810.5) scale(0.7917)" class="ic ic-accent"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="662.0" y="826.0" class="st" text-anchor="start">Runs</text><polyline points="714,820 818,820" class="e e-call" marker-end="url(#p-call)"/><circle cx="848" cy="820" r="19" class="bdg bdg-accent"/><g transform="translate(838.5 810.5) scale(0.7917)" class="ic ic-accent"><path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/></g><text x="876.0" y="826.0" class="st" text-anchor="start">Check</text><polyline points="937,820 1032,820" class="e e-call" marker-end="url(#p-call)"/><circle cx="1062" cy="820" r="19" class="bdg bdg-accent"/><g transform="translate(1052.5 810.5) scale(0.7917)" class="ic ic-accent"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></g><text x="1090.0" y="826.0" class="st" text-anchor="start">Verdict</text><polyline points="1169,820 1246,820" class="e e-call" marker-end="url(#p-call)"/><circle cx="1276" cy="820" r="19" class="bdg bdg-accent"/><g transform="translate(1266.5 810.5) scale(0.7917)" class="ic ic-accent"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></g><text x="1304.0" y="826.0" class="st" text-anchor="start">Memory</text><path d="M1384,820 H1488 Q1500,820 1500,832 V840 Q1500,852 1488,852 H432 Q420,852 420,844 V842" class="e e-call cyc" marker-end="url(#p-call)"/><rect x="868" y="843" width="185" height="18" class="usual"/><text x="960.0" y="856.0" class="el mu l-call" text-anchor="middle"><tspan class="it">informs the next proposal</tspan></text></svg>
