<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="How Beamtime works: a training script writes plain run directories; an index cache ingests them; one operation set (queries, research record, views) answers the web UI, the CLI and the MCP server, used by people and coding agents; remote clusters answer over ssh." class="pres"><title>How Beamtime works</title><style>
text{font-family:Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif}
.title{font-size:42px;font-weight:700;letter-spacing:-.015em}
.title .it{font-style:italic}
.subtitle{font-size:20px}
.bd{font-weight:700}
.it{font-style:italic}
.cd{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.84em}
.colh{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em}
.ct{font-size:22px;font-weight:700}
.st{font-size:17px;font-weight:700}
.at{font-size:17px;font-weight:700}
.pl{font-size:16px}
.tx{font-size:15.5px}
.sm{font-size:14px}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
.code .cd{font-size:13px}
.chipt{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.el{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12.5px;font-weight:500}
.el.mu{font-family:Charter,"Bitstream Charter","Iowan Old Style",Georgia,serif;font-size:13px;font-weight:400}
.card{stroke-width:1}
.sub{stroke-width:1}
.chip{stroke-width:1}
.bdg{stroke:none}
.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.e{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.e-read{stroke-dasharray:7 5;stroke-linecap:butt}
.e-event{stroke-dasharray:1 5;stroke-width:2.6}
.e-ssh{stroke-width:2.4}

.bg{fill:#faf9f6}
text{fill:#1c1d20}
.subtitle,.mu,.mu .it,.mu .bd{fill:#64625c}
.subtitle .bd{fill:#1c1d20}
.colh{fill:#8f8c84}
.card{fill:#ffffff;stroke:#e3e0d8}
.sub{fill:#faf9f6;stroke:#e3e0d8}
.band{fill:#f2f0eb}
.chip-run{fill:#f2f0eb;stroke:#e3e0d8}
.chip-auth{fill:#ffffff;stroke:#2f5aa8}
.e-call{stroke:#64625c}.mk-call{fill:#64625c}.l-call,.l-call .it{fill:#64625c}
.e-write{stroke:#c4501d}.mk-write{fill:#c4501d}.l-write,.l-write .it{fill:#c4501d}
.e-read{stroke:#2f5aa8}.mk-read{fill:#2f5aa8}.l-read,.l-read .it{fill:#2f5aa8}
.e-event{stroke:#3f7d3a}.mk-event{fill:#3f7d3a}.l-event,.l-event .it{fill:#3f7d3a}
.e-ssh{stroke:#9a3f72}.mk-ssh{fill:#9a3f72}.l-ssh,.l-ssh .it{fill:#9a3f72}
.ic-front{stroke:#2a78d6}.bdg-front{fill:#2a78d6;fill-opacity:.11}
.ic-svc{stroke:#6250d6}.bdg-svc{fill:#6250d6;fill-opacity:.11}
.ic-dom{stroke:#16936a}.bdg-dom{fill:#16936a;fill-opacity:.11}
.ic-idx{stroke:#b07a00}.bdg-idx{fill:#b07a00;fill-opacity:.11}
.ic-store{stroke:#8a6a45}.bdg-store{fill:#8a6a45;fill-opacity:.11}
.ic-remote{stroke:#c2457a}.bdg-remote{fill:#c2457a;fill-opacity:.11}
.ic-actor{stroke:#1c1d20}.bdg-actor{fill:#1c1d20;fill-opacity:.11}
.ic-accent{stroke:#2f5aa8}.bdg-accent{fill:#2f5aa8;fill-opacity:.11}
@media (prefers-color-scheme: dark){
.bg{fill:#1e1e1c}
text{fill:#eceae4}
.subtitle,.mu,.mu .it,.mu .bd{fill:#a19d94}
.subtitle .bd{fill:#eceae4}
.colh{fill:#76736c}
.card{fill:#2c2c29;stroke:#393834}
.sub{fill:#1e1e1c;stroke:#393834}
.band{fill:#252523}
.chip-run{fill:#252523;stroke:#393834}
.chip-auth{fill:#2c2c29;stroke:#86a8e8}
.e-call{stroke:#a19d94}.mk-call{fill:#a19d94}.l-call,.l-call .it{fill:#a19d94}
.e-write{stroke:#eb8a5a}.mk-write{fill:#eb8a5a}.l-write,.l-write .it{fill:#eb8a5a}
.e-read{stroke:#86a8e8}.mk-read{fill:#86a8e8}.l-read,.l-read .it{fill:#86a8e8}
.e-event{stroke:#7fb77a}.mk-event{fill:#7fb77a}.l-event,.l-event .it{fill:#7fb77a}
.e-ssh{stroke:#d38bb5}.mk-ssh{fill:#d38bb5}.l-ssh,.l-ssh .it{fill:#d38bb5}
.ic-front{stroke:#6ea6ec}.bdg-front{fill:#6ea6ec;fill-opacity:.11}
.ic-svc{stroke:#9085e9}.bdg-svc{fill:#9085e9;fill-opacity:.11}
.ic-dom{stroke:#4fc39a}.bdg-dom{fill:#4fc39a;fill-opacity:.11}
.ic-idx{stroke:#d9a548}.bdg-idx{fill:#d9a548;fill-opacity:.11}
.ic-store{stroke:#c09a70}.bdg-store{fill:#c09a70;fill-opacity:.11}
.ic-remote{stroke:#e283ab}.bdg-remote{fill:#e283ab;fill-opacity:.11}
.ic-actor{stroke:#eceae4}.bdg-actor{fill:#eceae4;fill-opacity:.11}
.ic-accent{stroke:#86a8e8}.bdg-accent{fill:#86a8e8;fill-opacity:.11}
}</style><defs><marker id="p-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-call"/></marker><marker id="p-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-write"/></marker><marker id="p-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-read"/></marker><marker id="p-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-event"/></marker><marker id="p-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="mk-ssh"/></marker></defs><rect class="bg" x="0" y="0" width="1600" height="900"/><text x="64.0" y="74.0" class="title" text-anchor="start">How <tspan class="it">Beamtime</tspan> works</text><text x="64.0" y="110.0" class="subtitle" text-anchor="start">Runs are <tspan class="bd">plain files</tspan>, the index is <tspan class="bd">a cache</tspan>, and every frontend calls <tspan class="bd">one operation set</tspan>.</text><text x="66.0" y="154.0" class="colh" text-anchor="start">RECORD</text><text x="562.0" y="154.0" class="colh" text-anchor="start">INDEX AND ANSWER</text><text x="1102.0" y="154.0" class="colh" text-anchor="start">READ AND ACT</text><rect x="64" y="170" width="380" height="130" rx="12" class="card"/><circle cx="102" cy="206" r="19" class="bdg bdg-front"/><g transform="translate(92.0 196.0) scale(0.8333)" class="ic ic-front"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g><text x="132.0" y="213.0" class="ct" text-anchor="start">Training script</text><text x="88.0" y="246.0" class="code" text-anchor="start"><tspan class="cd">run = beamtime.init(...)</tspan></text><text x="88.0" y="267.0" class="code" text-anchor="start"><tspan class="cd">run.log({"loss": 0.31})</tspan></text><text x="88.0" y="290.0" class="tx mu" text-anchor="start"><tspan class="it">Never blocks or breaks training.</tspan></text><rect x="64" y="336" width="380" height="244" rx="12" class="card"/><circle cx="102" cy="372" r="19" class="bdg bdg-store"/><g transform="translate(92.0 362.0) scale(0.8333)" class="ic ic-store"><path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M3 5a2 2 0 0 0 2 2h3"/><path d="M3 3v13a2 2 0 0 0 2 2h3"/></g><text x="132.0" y="379.0" class="ct" text-anchor="start">Run directories</text><text x="88.0" y="410.0" class="tx" text-anchor="start"><tspan class="bd">Plain files</tspan> are the source of truth.</text><rect x="88.0" y="426" width="82.8" height="24" rx="6" class="chip chip-run"/><text x="97.0" y="442.5" class="chipt">_run.json</text><rect x="178.8" y="426" width="104.4" height="24" rx="6" class="chip chip-run"/><text x="187.8" y="442.5" class="chipt">_config.json</text><rect x="291.2" y="426" width="118.8" height="24" rx="6" class="chip chip-run"/><text x="300.2" y="442.5" class="chipt">_metrics.jsonl</text><rect x="88.0" y="458" width="61.2" height="24" rx="6" class="chip chip-run"/><text x="97.0" y="474.5" class="chipt">_data/</text><rect x="157.2" y="458" width="111.6" height="24" rx="6" class="chip chip-run"/><text x="166.2" y="474.5" class="chipt">_events.jsonl</text><rect x="276.8" y="458" width="97.2" height="24" rx="6" class="chip chip-run"/><text x="285.8" y="474.5" class="chipt">_output.log</text><text x="88.0" y="508.0" class="tx mu sm" text-anchor="start"><tspan class="it">machine-written by the SDK, one writer each</tspan></text><rect x="88.0" y="522" width="82.8" height="24" rx="6" class="chip chip-auth"/><text x="97.0" y="538.5" class="chipt">proposal/</text><rect x="178.8" y="522" width="61.2" height="24" rx="6" class="chip chip-auth"/><text x="187.8" y="538.5" class="chipt">notes/</text><rect x="248.0" y="522" width="54.0" height="24" rx="6" class="chip chip-auth"/><text x="257.0" y="538.5" class="chipt">view/</text><rect x="310.0" y="522" width="68.4" height="24" rx="6" class="chip chip-auth"/><text x="319.0" y="538.5" class="chipt">memory/</text><text x="88.0" y="568.0" class="tx mu sm" text-anchor="start"><tspan class="it">authored: one new file per version</tspan></text><rect x="64" y="616" width="380" height="136" rx="12" class="card"/><circle cx="102" cy="652" r="19" class="bdg bdg-remote"/><g transform="translate(92.0 642.0) scale(0.8333)" class="ic ic-remote"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g><text x="132.0" y="659.0" class="ct" text-anchor="start">Remote cluster</text><text x="88.0" y="688.0" class="tx" text-anchor="start">The same run directories on the</text><text x="88.0" y="709.0" class="tx" text-anchor="start">cluster filesystem, answered by</text><text x="88.0" y="734.0" class="code" text-anchor="start"><tspan class="cd">beamtime serve --stdio</tspan></text><rect x="560" y="170" width="440" height="130" rx="12" class="card"/><circle cx="598" cy="206" r="19" class="bdg bdg-idx"/><g transform="translate(588.0 196.0) scale(0.8333)" class="ic ic-idx"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="628.0" y="213.0" class="ct" text-anchor="start">Index</text><text x="584.0" y="244.0" class="tx" text-anchor="start"><tspan class="bd">SQLite</tspan> and column files in <tspan class="cd">~/.cache</tspan>,</text><text x="584.0" y="265.0" class="tx" text-anchor="start">never on a cluster filesystem.</text><text x="584.0" y="288.0" class="tx mu" text-anchor="start"><tspan class="it">A cache: rebuilt from the files at any time.</tspan></text><rect x="560" y="336" width="440" height="416" rx="12" class="card"/><circle cx="598" cy="372" r="19" class="bdg bdg-svc"/><g transform="translate(588.0 362.0) scale(0.8333)" class="ic ic-svc"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g><text x="628.0" y="379.0" class="ct" text-anchor="start">Operation set</text><text x="584.0" y="410.0" class="tx" text-anchor="start">One set for the <tspan class="bd">CLI</tspan>, <tspan class="bd">MCP</tspan> and the <tspan class="bd">web UI</tspan>:</text><text x="584.0" y="431.0" class="tx" text-anchor="start">same names, same answers.</text><rect x="580" y="452" width="400" height="86" rx="9" class="sub"/><g transform="translate(594.0 467.0) scale(0.8333)" class="ic ic-dom"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g><text x="626.0" y="483.0" class="st" text-anchor="start">Queries</text><text x="626.0" y="506.0" class="tx sm" text-anchor="start">runs, series, groups, timeline</text><text x="626.0" y="526.0" class="tx sm" text-anchor="start"><tspan class="it">one read path,</tspan> <tspan class="cd">math.fsum</tspan> <tspan class="it">everywhere</tspan></text><rect x="580" y="550" width="400" height="86" rx="9" class="sub"/><g transform="translate(594.0 565.0) scale(0.8333)" class="ic ic-dom"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="626.0" y="581.0" class="st" text-anchor="start">Research record</text><text x="626.0" y="604.0" class="tx sm" text-anchor="start">proposals with <tspan class="bd">predictions</tspan>, checked by</text><text x="626.0" y="624.0" class="tx sm" text-anchor="start">t-intervals; notes carry the <tspan class="it">verdicts</tspan></text><rect x="580" y="648" width="400" height="86" rx="9" class="sub"/><g transform="translate(594.0 663.0) scale(0.8333)" class="ic ic-dom"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></g><text x="626.0" y="679.0" class="st" text-anchor="start">Views</text><text x="626.0" y="702.0" class="tx sm" text-anchor="start">YAML trees of widgets and <tspan class="it">custom blocks</tspan>,</text><text x="626.0" y="722.0" class="tx sm" text-anchor="start">built by agents, rendered by the UI</text><rect x="1100" y="170" width="260" height="170" rx="12" class="card"/><circle cx="1138" cy="206" r="19" class="bdg bdg-front"/><g transform="translate(1128.0 196.0) scale(0.8333)" class="ic ic-front"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="1168.0" y="213.0" class="ct" text-anchor="start">Web UI</text><text x="1124.0" y="246.0" class="code" text-anchor="start"><tspan class="cd">beamtime serve</tspan></text><text x="1124.0" y="274.0" class="tx" text-anchor="start">Every state has a URL;</text><text x="1124.0" y="295.0" class="tx" text-anchor="start">updates arrive <tspan class="it">live</tspan>.</text><rect x="1100" y="376" width="260" height="170" rx="12" class="card"/><circle cx="1138" cy="412" r="19" class="bdg bdg-front"/><g transform="translate(1128.0 402.0) scale(0.8333)" class="ic ic-front"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></g><text x="1168.0" y="419.0" class="ct" text-anchor="start">CLI</text><text x="1124.0" y="452.0" class="code" text-anchor="start"><tspan class="cd">beamtime runs --json</tspan></text><text x="1124.0" y="480.0" class="tx" text-anchor="start">Text for people,</text><text x="1124.0" y="501.0" class="tx" text-anchor="start"><tspan class="it">JSON</tspan> for agents.</text><rect x="1100" y="582" width="260" height="170" rx="12" class="card"/><circle cx="1138" cy="618" r="19" class="bdg bdg-front"/><g transform="translate(1128.0 608.0) scale(0.8333)" class="ic ic-front"><path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/></g><text x="1168.0" y="625.0" class="ct" text-anchor="start">MCP server</text><text x="1124.0" y="658.0" class="code" text-anchor="start"><tspan class="cd">note_add</tspan> · <tspan class="cd">runs</tspan> · <tspan class="cd">view_save</tspan></text><text x="1124.0" y="686.0" class="tx" text-anchor="start">Tools named after</text><text x="1124.0" y="707.0" class="tx" text-anchor="start">the CLI commands.</text><circle cx="1478" cy="300" r="34" class="bdg bdg-accent"/><g transform="translate(1463.0 285.0) scale(1.2500)" class="ic ic-accent"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g><text x="1478.0" y="362.0" class="at" text-anchor="middle">User</text><text x="1478.0" y="382.0" class="tx mu sm" text-anchor="middle"><tspan class="it">reads and</tspan></text><text x="1478.0" y="399.0" class="tx mu sm" text-anchor="middle"><tspan class="it">decides</tspan></text><circle cx="1478" cy="628" r="34" class="bdg bdg-accent"/><g transform="translate(1463.0 613.0) scale(1.2500)" class="ic ic-accent"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="1478.0" y="690.0" class="at" text-anchor="middle">Coding agent</text><text x="1478.0" y="710.0" class="tx mu sm" text-anchor="middle"><tspan class="it">proposes, notes,</tspan></text><text x="1478.0" y="727.0" class="tx mu sm" text-anchor="middle"><tspan class="it">builds views</tspan></text><polyline points="1442,300 1404,300 1404,255 1360,255" class="e e-call" marker-end="url(#p-call)"/><polyline points="1404,300 1404,461 1360,461" class="e e-call" marker-end="url(#p-call)"/><polyline points="1442,628 1404,628 1404,491 1360,491" class="e e-call" marker-end="url(#p-call)"/><polyline points="1404,628 1404,667 1360,667" class="e e-call" marker-end="url(#p-call)"/><polyline points="1100,270 1050,270" class="e e-call"/><polyline points="1100,476 1050,476" class="e e-call"/><polyline points="1100,682 1050,682" class="e e-call"/><polyline points="1050,270 1050,682" class="e e-call"/><polyline points="1050,560 1000,560" class="e e-call" marker-end="url(#p-call)"/><text x="1025.0" y="552.0" class="el l-call" text-anchor="middle">calls</text><polyline points="1000,205 1100,205" class="e e-event" marker-end="url(#p-event)"/><text x="1050.0" y="197.0" class="el l-event" text-anchor="middle">live updates</text><polyline points="780,300 780,336" class="e e-call" marker-end="url(#p-call)"/><text x="790.0" y="323.0" class="el l-call" text-anchor="start">answers queries</text><polyline points="254,300 254,336" class="e e-write" marker-end="url(#p-write)"/><text x="264.0" y="323.0" class="el l-write" text-anchor="start">writes</text><polyline points="444,400 502,400 502,235 560,235" class="e e-read" marker-end="url(#p-read)"/><text x="512.0" y="323.0" class="el l-read" text-anchor="start">ingests changes</text><polyline points="560,520 444,520" class="e e-write" marker-end="url(#p-write)"/><text x="502.0" y="510.0" class="el l-write" text-anchor="middle">additive writes</text><text x="502.0" y="538.0" class="el mu l-write" text-anchor="middle"><tspan class="it">new files only</tspan></text><polyline points="444,692 560,692" class="e e-ssh" marker-end="url(#p-ssh)"/><text x="502.0" y="682.0" class="el l-ssh" text-anchor="middle">ssh</text><text x="502.0" y="710.0" class="el l-ssh" text-anchor="middle">JSON lines</text><rect x="64" y="786" width="1472" height="82" rx="12" class="band"/><circle cx="108" cy="827" r="20" class="bdg bdg-store"/><g transform="translate(98.0 817.0) scale(0.8333)" class="ic ic-store"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="140.0" y="821.0" class="pl" text-anchor="start"><tspan class="bd">Files are the truth.</tspan></text><text x="140.0" y="843.0" class="tx mu sm" text-anchor="start">One writer per file; the index is only a cache.</text><circle cx="598" cy="827" r="20" class="bdg bdg-svc"/><g transform="translate(588.0 817.0) scale(0.8333)" class="ic ic-svc"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="630.0" y="821.0" class="pl" text-anchor="start"><tspan class="bd">Agents first.</tspan></text><text x="630.0" y="843.0" class="tx mu sm" text-anchor="start">Agents log runs, check predictions and build views.</text><circle cx="1088" cy="827" r="20" class="bdg bdg-dom"/><g transform="translate(1078.0 817.0) scale(0.8333)" class="ic ic-dom"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="1120.0" y="821.0" class="pl" text-anchor="start"><tspan class="bd">Records, never runs.</tspan></text><text x="1120.0" y="843.0" class="tx mu sm" text-anchor="start">Beamtime observes experiments; it never launches them.</text></svg>
