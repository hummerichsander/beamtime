[project]
name = "beamtime"
version = "0.1.0"
description = "Agents-first experiment logging: runs with proposals and verdicts, and views built by agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "hummerichsander", email = "sander.hummerich@gmx.de" }
]
requires-python = ">=3.10"
dependencies = [
    "msgspec>=0.22.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
beamtime = "beamtime.cli:main"

[project.optional-dependencies]
serve = [
    "mcp>=2.3.0",
    "playwright>=1.64.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]
figures = [
    "matplotlib>=3.10.9",
    "scienceplots>=2.2.2",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "scienceplots>=2.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests", "bench", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scienceplots registers its styles with functions matplotlib 3.11 deprecates; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:scienceplots"]
