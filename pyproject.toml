[project]
name = "beamtime"
version = "0.0.1"
description = "Agents-first experiment logging: runs with hypotheses, results and agent-built report pages."
readme = "README.md"
authors = [
    { name = "hummerichsander", email = "sander.hummerich@gmx.de" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
beamtime = "beamtime.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
